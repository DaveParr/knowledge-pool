[project]
name = "knowledge-pool"
version = "0.1.0"
description = "A full-stack Jac application"
entry-point = "main.jac"
kind = "fullstack"

[dependencies.npm]
react = "18.3.1"
react-dom = "18.3.1"
react-router-dom = "6.30.6"
react-error-boundary = "5.0.0"
react-hook-form = "7.91.0"
zod = "4.6.7"
"@hookform/resolvers" = "5.9.2"

[dependencies.npm.dev]
vite = "6.4.5"
"@vitejs/plugin-react" = "4.7.0"
typescript = "5.9.3"
"@types/react" = "18.3.31"
"@types/react-dom" = "18.3.7"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[plugins.client]

[test]
directory = "tests"

[scripts]
check = "jac check *.jac && scripts/jac_test.sh && pytest tests"
up = "scripts/dev.sh up"
down = "scripts/dev.sh down"
status = "scripts/dev.sh status"
catalogue = "python -m catalog.ingest --if-stale"
test-ui = "pytest tests/test_ui_smoke.py -v"
