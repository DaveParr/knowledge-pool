[project]
name = "knowledge-pool"
version = "0.1.0"
description = "A full-stack Jac application"
default-app = "knowledge-pool"
jac-version = "==0.39.2"

[dependencies.npm]
react = "18.3.1"
react-dom = "18.3.1"
react-router-dom = "6.30.6"
react-error-boundary = "5.0.0"
react-hook-form = "7.91.0"
zod = "4.6.7"
"@hookform/resolvers" = "5.9.2"

[dependencies.npm.dev]
vite = "6.4.5"
"@vitejs/plugin-react" = "4.7.0"
typescript = "5.9.3"
"@types/react" = "18.3.31"
"@types/react-dom" = "18.3.7"

[dependencies.pypi]
mcp = "==2.3.0"

[dev-dependencies.pypi]
watchdog = ">=3.0.0"
jsonschema = "==4.26.0"
pytest = ">=9.2.0"

[test]
directory = "tests"
# The runner registers the guest as Jac's shared root for the whole process,
# and `jac test` does not clear it between files. A file that walks without
# the runner, after it in the same worker, would find a guest root that is gone.
isolate = ["tests/graph_runner_tests.jac"]

[scripts]
check = "export JAC_STRICT_PERMISSIONS=1; (jac check *.jac && scripts/jac_test.sh && jac x pytest tests); status=$?; jac db prune -y; exit $status"
up = "scripts/dev.sh up"
down = "scripts/dev.sh down"
status = "scripts/dev.sh status"
catalogue = "python -m catalog.ingest --if-stale"
test-ui = "jac x pytest tests/test_ui_smoke.py -v"

[serve.workers]
count = "1"

[apps.knowledge-pool]
kind = "web-app"
entry-point = "main"

