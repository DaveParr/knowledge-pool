name: Test

on:
  pull_request:
    branches: [main, DaveParr/planning-deployment]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, DaveParr/planning-deployment]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Jac (the version jac.toml pins)
        run: |
          scripts/install_jac.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: jac install --dev --frozen

      - name: Check
        env:
          KP_REQUIRE_BROWSER: "1"
        run: jac x check

      - name: Probe processes
        if: failure()
        run: |
          ps -eo pid,ppid,rss,etime,args --sort=-rss | head -60
          df -h /tmp /dev/shm; free -m; ls -la ~/.cache || true
          ss -ltnp || true

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-output
          path: test-artifacts/
          if-no-files-found: ignore
