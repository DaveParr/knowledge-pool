name: Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Type-check
        run: uv run jac check main.jac decks.sv.jac frontend.cl.jac frontend.impl.jac

      - name: Run walker tests
        run: uv run jac test

      - name: Run pytest suite
        run: uv run pytest tests
