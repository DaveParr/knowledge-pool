<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, light-dark(#ffffff, #1f1e1d));
    --fg: var(--color-text-primary, light-dark(#1f1e1d, #f5f4ef));
    --muted: var(--color-text-secondary, light-dark(#6b6a65, #a6a49c));
    --line: var(--color-border-tertiary, light-dark(#e6e4dc, #3a3935));
    --soft: var(--color-background-secondary, light-dark(#f6f5f1, #282725));
    --ok-bg: var(--color-background-success, light-dark(#e8f5e9, #16301b));
    --ok-fg: var(--color-text-success, light-dark(#1b5e20, #9fd8a6));
    --bad-bg: var(--color-background-danger, light-dark(#fdecea, #3a1714));
    --bad-fg: var(--color-text-danger, light-dark(#8a1c13, #f2a59c));
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 var(--font-sans, system-ui, sans-serif); }
  main { padding: 12px 16px 16px; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .meta { color: var(--muted); margin: 0 0 10px; }
  .status { padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
  .status.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .status.bad { background: var(--bad-bg); color: var(--bad-fg); }
  .status ul { margin: 4px 0 0; padding-left: 18px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin: 14px 0 4px; }
  .empty { color: var(--muted); }
  /* One compact line per card; each expands to its in-game details. */
  .zonehead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .zonehead button { font: inherit; font-size: 12px; color: var(--muted); background: none;
    border: 1px solid transparent; border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .zonehead button:hover { border-color: var(--line); color: var(--fg); }
  :root { --cols: 10px 2.2em minmax(0, 1fr) 7em minmax(0, 30%) 3.5em; }
  .colhead { display: grid; grid-template-columns: var(--cols); gap: 8px; padding: 0 4px 2px;
    color: var(--muted); font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--line); }
  .colhead span:nth-child(2), .colhead span:last-child { text-align: right; }
  ul.cards { list-style: none; margin: 0; padding: 0; }
  li.card { border-bottom: 1px solid var(--line); }
  li.card > details > summary { list-style: none; cursor: pointer; display: grid;
    grid-template-columns: var(--cols); gap: 8px; align-items: baseline; padding: 5px 4px; }
  li.card > details > summary::-webkit-details-marker { display: none; }
  li.card > details > summary::before { content: "▸"; content: "▸" / ""; font-size: 10px; color: var(--muted); transition: transform .12s; }
  li.card > details[open] > summary::before { transform: rotate(90deg); }
  li.card > details[open] > summary { background: var(--soft); border-radius: 6px 6px 0 0; }
  .n, .pt { text-align: right; font-variant-numeric: tabular-nums; }
  .pt { font-weight: 600; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .cost { white-space: nowrap; }
  .type { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .body { background: var(--soft); border-radius: 0 0 6px 6px; padding: 4px 12px 12px 30px;
    display: grid; gap: 10px; font-size: 13px; }
  .face { border-left: 2px solid var(--line); padding-left: 10px; }
  .face h3 { font-size: 13px; margin: 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .face .ft { color: var(--muted); font-size: 12px; font-weight: 400; display: inline-flex; gap: 6px; align-items: center; }
  .rules { white-space: pre-line; margin: 4px 0 0; }
  .stats { display: inline-block; margin: 4px 6px 0 0; padding: 1px 8px; border: 1px solid var(--line);
    border-radius: 6px; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 12px; }
  dl { display: grid; grid-template-columns: 8em minmax(0, 1fr); gap: 4px 10px; margin: 0; }
  dt { color: var(--muted); }
  dt.quiet { font-size: 12px; }
  dd { margin: 0; }
  dd.tags { color: var(--muted); font-size: 11px; }
  .pills { display: flex; flex-wrap: wrap; gap: 4px; }
  .pill {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    background: var(--line); color: var(--muted); font-size: 11px; white-space: nowrap;
  }
  .pill.kw { background: var(--bg); border: 1px solid var(--line); color: var(--fg); }
  @media (max-width: 520px) {
    :root { --cols: 10px 2em minmax(0, 1fr) 6em 3em; }
    .type, .colhead span:nth-child(5) { display: none; }
  }
  /* Mana symbol pills (same as mana_cost.css in the web app). */
  :root { --mana-w: #f8f3d6; --mana-u: #b4d7f0; --mana-b: #c8c1bd; --mana-r: #f0a68c; --mana-g: #9fd0ae; --mana-c: #d8d4cc; }
  .mc-cost { display: inline-flex; flex-wrap: wrap; gap: 2px; align-items: center; vertical-align: middle; }
  .mc-sym { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px;
    padding: 0 4px; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(0, 0, 0, .18);
    color: #1f1e1d; font: 600 11px/1 var(--font-sans, system-ui, sans-serif); font-variant-numeric: tabular-nums; }
  .mc-sep { color: var(--muted); font-size: 11px; margin: 0 2px; }

  /* Pool block (design system: https://claude.ai/artifact/CdjUrrHAgydY9QAXQSBLUG).
     The host's colours, Pool block's shape: ink rules and frames, hard offset
     shadows, heavy headings, the pool gradient on the title and main action. */
  :root {
    --line: var(--fg);
    --pool: linear-gradient(110deg, #b4d7f0 0%, #d7c9de 50%, #f0a68c 100%);
    --pool-down: linear-gradient(180deg, #f0a68c, #d7c9de 55%, #b4d7f0);
    --on-pool: #1d1c1a;
    --shadow-control: 3px 3px 0 var(--fg);
    --shadow-panel: 4px 4px 0 var(--fg);
  }
  main { padding: 14px 18px 18px; }
  h1 {
    display: inline-block; margin: 0 6px 10px 0; padding: 8px 14px; background: var(--pool); color: var(--on-pool);
    border: 3px solid var(--fg); border-radius: 10px; box-shadow: var(--shadow-panel);
    font-size: 17px; font-weight: 900; letter-spacing: -.01em;
  }
  h2 { color: var(--fg); font-weight: 900; letter-spacing: .06em; }
  .meta { font-weight: 600; }
  button {
    font-weight: 700; color: var(--fg); background: var(--bg);
    border: 2.5px solid var(--fg); border-radius: 6px; box-shadow: var(--shadow-control);
  }
  button.primary { background: var(--pool); color: var(--on-pool); border-color: var(--fg); }
  button:disabled { box-shadow: none; }
  input, textarea {
    border: 2.5px solid var(--fg) !important; border-radius: 6px; box-shadow: var(--shadow-control);
  }
  .status, .toast, .note { border: 2px solid var(--fg); font-weight: 600; }
  .mc-sym { border: 2px solid var(--fg); }

  ul.cards { border: 3px solid var(--fg); border-radius: 8px; box-shadow: var(--shadow-panel); padding: 2px 10px; margin-right: 4px; }
  li.card { border-bottom: 2px solid var(--fg); }
  li.card:last-child { border-bottom: 0; }
  .colhead { border-bottom: 2px solid var(--fg); text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; font-weight: 700; }
  .name, .n, .pt { font-weight: 800; }
  .face { border-left: 2px solid var(--fg); }
  .stats, .pill.kw { border: 2px solid var(--fg); border-radius: 4px; }
  .pill { border-radius: 4px; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
</style>
<!-- @include refusal.html -->
</head>
<body>
<main id="app"><p class="empty">Loading deck…</p></main>
<script>
// Minimal MCP Apps view (spec 2026-01-26) with no SDK: JSON-RPC over postMessage.
(() => {
  const app = document.getElementById("app");
  let nextId = 1;
  const pending = new Map();
  const send = (msg) => window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    send({ id, method, params });
  });
  const notify = (method, params) => send({ method, params });

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  // "{1}{R} // {U}" -> symbol pills; hybrids like {W/U} are split diagonally.
  const manaColour = (p) => "WUBRG".includes(p) && p.length === 1 ? `var(--mana-${p.toLowerCase()})` : "var(--mana-c)";
  function manaPills(cost) {
    if (!cost) return "";
    const faces = String(cost).split("//").map((face) => (face.match(/\{[^}]+\}/g) || []).map((m) => {
      const sym = m.slice(1, -1), parts = sym.split("/").filter((p) => p !== "P");
      const bg = parts.length > 1 ? `linear-gradient(135deg, ${manaColour(parts[0])} 50%, ${manaColour(parts[1])} 50%)` : manaColour(parts[0] || sym);
      return `<span class="mc-sym" style="background:${bg}">${esc(sym)}</span>`;
    }).join(""));
    return `<span class="mc-cost" role="img" aria-label="Mana cost ${esc(cost)}">${faces.join('<span class="mc-sep">//</span>')}</span>`;
  }

  function applyHost(ctx) {
    if (!ctx) return;
    const vars = ctx.styles && ctx.styles.variables;
    if (vars) for (const [k, v] of Object.entries(vars)) if (v) document.documentElement.style.setProperty(k, v);
    if (ctx.theme) document.documentElement.style.colorScheme = ctx.theme;
    applyContainer(ctx.containerDimensions);
  }

  // The host's room for this view (MCP Apps containerDimensions): a fixed height means fill
  // it, a maxHeight means grow to it. Either way, scroll inside when the view is taller, so
  // nothing past the host's limit is cut off (#234).
  function applyContainer(dims) {
    if (!dims) return;
    const s = document.documentElement.style;
    if (dims.height) { s.height = "100vh"; s.maxHeight = ""; }
    else if (dims.maxHeight) { s.height = ""; s.maxHeight = dims.maxHeight + "px"; }
    else return;
    s.overflowY = "auto";
  }

  // Front-face power/toughness for the card's row ("2/2"), or "".
  const pt = (c) => (c.power || c.toughness ? `${c.power}/${c.toughness}` : "");

  // A face's stat badges: loyalty and defence, plus P/T when the row doesn't already show it.
  function stats(f, withPT) {
    const out = [];
    if (withPT && pt(f)) out.push(`<span class="stats" title="Power/toughness">${esc(pt(f))}</span>`);
    if (f.loyalty) out.push(`<span class="stats">Loyalty ${esc(f.loyalty)}</span>`);
    if (f.defense) out.push(`<span class="stats">Defence ${esc(f.defense)}</span>`);
    return out.length ? `<div>${out.join("")}</div>` : "";
  }

  // The expanded part of a card: rules text per face, stats, keywords, this
  // deck's notes for the card, then Scryfall tags (last, in quieter text).
  function details(c) {
    const faces = (c.faces || []).length
      ? c.faces.map((f, i) => `<div class="face">
          <h3>${esc(f.name)} <span class="ft">${manaPills(f.mana_cost)}${f.mana_cost ? " · " : ""}${esc(f.type_line)}</span></h3>
          ${f.text ? `<p class="rules">${esc(f.text)}</p>` : ""}${stats(f, i > 0)}</div>`).join("")
      : (c.text || c.loyalty || c.defense
        ? `<div class="face">${c.text ? `<p class="rules">${esc(c.text)}</p>` : ""}${stats(c, false)}</div>` : "");
    const keywords = c.keywords || [], roles = c.roles || [], tags = c.oracle_tags || [];
    const notes = [
      ...roles.map((r) => `<span class="pill">${esc(r)}</span>`),
      c.locked ? `<span class="pill">locked</span>` : "",
      c.reason ? `<span>“${esc(c.reason)}”</span>` : "",
    ].filter(Boolean).join(" ");
    const rows = [
      keywords.length ? `<dt>Keywords</dt><dd class="pills">${keywords.map((k) => `<span class="pill kw">${esc(k)}</span>`).join("")}</dd>` : "",
      notes ? `<dt>In this deck</dt><dd>${notes}</dd>` : "",
      tags.length ? `<dt class="quiet">Scryfall tags</dt><dd class="tags">${tags.map(esc).join(" · ")}</dd>` : "",
    ].join("");
    return `<div class="body">${faces}${rows ? `<dl>${rows}</dl>` : ""}</div>`;
  }

  function zoneList(title, zone, rows) {
    if (!rows.length) return "";
    const total = rows.reduce((a, r) => a + r.count, 0);
    return `<div class="zonehead"><h2>${esc(title)} (${total})</h2>
        <span><button type="button" data-all="open" data-zone="${zone}">Expand all</button><button type="button" data-all="close" data-zone="${zone}">Collapse all</button></span></div>
      <div class="colhead" aria-hidden="true"><span></span><span>#</span><span>Card</span><span>Cost</span><span>Type</span><span>P/T</span></div>
      <ul class="cards" data-zone="${zone}">${rows.map((r) => `<li class="card"><details>
        <summary><span class="n">${r.count}</span><span class="name">${esc(r.name)}${r.collection_count !== undefined ? ` <small class="quiet">(${r.collection_count} owned)</small>` : ""}</span><span class="cost">${manaPills(r.mana_cost)}</span><span class="type" title="${esc(r.type_line)}">${esc(r.type_line)}</span><span class="pt">${esc(pt(r))}</span></summary>
        ${details(r)}</details></li>`).join("")}</ul>`;
  }

  // Expand all / Collapse all, per zone.
  app.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-all]");
    if (!b) return;
    app.querySelectorAll(`ul[data-zone="${b.dataset.zone}"] > li > details`).forEach((d) => { d.open = b.dataset.all === "open"; });
  });

  function render(deck) {
    if (!deck) {
      app.innerHTML = `<p class="empty">No deck.</p>`;
      return;
    }
    const cards = deck.cards || [];
    const violations = deck.violations || [];
    const gc = deck.game_changers;
    const sleeve = deck.sleeveable === undefined ? "" : deck.sleeveable ? "Sleeveable" : "Not sleeveable: missing " + (deck.missing || []).map((m) => m.count + " " + m.name).join(", ");
    const gcLine = gc ? "Game Changers: " + gc.count + (gc.count > 0 ? " — " + gc.cards.join(", ") : "") : "";
    app.innerHTML = `
      <h1>${esc(deck.name)}</h1>
      <p class="meta">${esc(deck.format)} · ${deck.main_total} main · ${deck.sideboard_total} sideboard</p>
      <div class="status ${deck.legal ? "ok" : "bad"}" role="status">
        <strong>${deck.legal ? "Legal" : "Not legal"}</strong>
        ${violations.length ? `<ul>${violations.map((v) => `<li>${esc(v.message)}</li>`).join("")}</ul>` : ""}
        ${sleeve ? `<p>${esc(sleeve)}</p>` : ""}
        ${gc ? `<div class="gc"><p>${esc(gcLine)}</p><p>${esc("Bracket hint: " + gc.bracket_hint + " (from Game Changers only, not a full bracket rating)")}</p></div>` : ""}
      </div>
      ${(deck.zones || []).map((z) => zoneList(z.title, z.key, cards.filter((c) => c.zone === z.key))).join("")}
      ${cards.length ? "" : `<p class="empty">This deck has no cards yet.</p>`}`;
  }

  const view = refusableView(app, "deck_show", render, request);

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && pending.has(msg.id) && !msg.method) {
      const p = pending.get(msg.id);
      pending.delete(msg.id);
      msg.error ? p.reject(msg.error) : p.resolve(msg.result);
      return;
    }
    if (msg.method === "ui/notifications/tool-input") {
      view.input(msg.params);
    } else if (msg.method === "ui/notifications/tool-result") {
      view.result(msg.params);
    } else if (msg.method === "ui/notifications/host-context-changed") {
      applyHost(msg.params);
    } else if (msg.method === "ui/resource-teardown" && msg.id !== undefined) {
      send({ id: msg.id, result: {} });
    } else if (msg.method === "ping" && msg.id !== undefined) {
      send({ id: msg.id, result: {} });
    }
  });

  new ResizeObserver(() => {
    const r = document.documentElement.getBoundingClientRect();
    notify("ui/notifications/size-changed", { width: Math.ceil(r.width), height: Math.ceil(r.height) });
  }).observe(document.documentElement);

  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "knowledge-pool-deck", version: "0.1.0" },
    appCapabilities: { availableDisplayModes: ["inline"] },
  }).then((result) => {
    applyHost(result && result.hostContext);
    notify("ui/notifications/initialized", {});
  });
})();
</script>
</body>
</html>
