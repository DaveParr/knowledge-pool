/* Layout: one phone-shaped app (tab bar at the bottom); at desktop width it can turn into a side rail. Pool block tokens from global.css. */

  --ok-bg: #c9ecd0; --ok-fg: #14461b; --warn-bg: #fff8e1; --warn-fg: #7a5300; --bad-fg: #8a1c13;

  --bg: #1f1e1d; --surface: #282725; --soft: #242321; --fg: #f5f4ef; --muted: #a6a49c; --on-ink: #1d1c1a;
  --ok-bg: #16301b; --ok-fg: #9fd8a6; --warn-bg: #33290f; --warn-fg: #f0c96a; --bad-fg: #f2a59c; --scrim: rgba(0,0,0,.6); color-scheme: dark; } }

  --bg: #1f1e1d; --surface: #282725; --soft: #242321; --fg: #f5f4ef; --muted: #a6a49c; --on-ink: #1d1c1a;
  --ok-bg: #16301b; --ok-fg: #9fd8a6; --warn-bg: #33290f; --warn-fg: #f0c96a; --bad-fg: #f2a59c; --scrim: rgba(0,0,0,.6); color-scheme: dark; }

const initials = u => USERS[u].split(' ').map(w => w[0]).join('').slice(0, 2);
function personRows(target) {
  return `<div class="list">${OTHERS.map(u => {
    const nd = DECKS.filter(d => d.owner === u).length, nc = sum(Object.values(COLL[u])), k = sum(leads(u).map(x => x.k));
    return `<div class="row person" data-act="open-person" data-user="${u}" data-target="${target}">
      <span class="rowmain"><span class="nm">${esc(USERS[u])}</span><span class="sub">${nd} deck${nd === 1 ? '' : 's'} · ${nc} cards</span></span>
      ${k ? `<span class="bd okc" title="Has ${k} cards you need" aria-label="Has ${k} cards you need">${icon('trade')}${k}</span>` : ''}</div>`;
  }).join('')}</div>`;
}
function renderGroups(res, row) {
  if (!res.shown) return `<p class="empty">Nothing matches. Clear a filter to see more.</p>`;
  return res.groups.map(g => `${g.label ? `<div class="gh">${esc(g.label)} <span class="badge">${sum(g.items.map(i => i.n))}</span></div>` : ''}<div class="list">${g.items.map(row).join('')}</div>`).join('');
}
function cardRow(ctx, it, sub, end) {
  return `<div class="row"><span class="cnt">${it.n}</span><div class="rowmain" data-act="card" data-ctx="${ctx}" data-id="${it.card.id}">
    <span class="nm">${esc(it.card.name)}</span><span class="sub">${sub}</span></div><span class="end">${pips(it.card)}${end || ''}</span></div>`;
}
const stepper = (kind, id, deck) => `<span class="step"><button data-act="${kind}-dec" data-id="${id}" ${deck ? `data-deck="${deck}"` : ''} aria-label="One fewer">−</button><button data-act="${kind}-inc" data-id="${id}" ${deck ? `data-deck="${deck}"` : ''} aria-label="One more">+</button></span>`;

// Edit lock: own decks and your collection open read-only; Edit turns the count controls on.
const editBtn = key => `<button class="editbtn ${S.edit === key ? 'on' : ''}" data-act="toggle-edit" data-key="${key}" aria-pressed="${S.edit === key}" aria-label="${S.edit === key ? 'Unlocked: changes allowed. Tap to lock' : 'Locked: read-only. Tap to unlock'}" title="${S.edit === key ? 'Unlocked' : 'Locked'}">${icon(S.edit === key ? 'unlock' : 'lock')}</button>`;
const editBar = what => `<div class="editbar">${icon('unlock')}<span>Unlocked. Changes to ${what} save as you make them${what === 'this deck' ? '; search finds any card' : ''}.</span></div>`;
const bigStep = (kind, id, n, deck) => `<span class="bigstep"><button data-act="${kind}-dec" data-id="${id}" ${deck ? `data-deck="${deck}"` : ''} aria-label="One fewer">−</button><span class="v">${n}</span><button data-act="${kind}-inc" data-id="${id}" ${deck ? `data-deck="${deck}"` : ''} aria-label="One more">+</button></span>`;
function editRow(ctx, it, sub, ctl) {
  return `<div class="row edit"><div class="rowmain" data-act="card" data-ctx="${ctx}" data-id="${it.card.id}"><span class="nm">${esc(it.card.name)} ${pips(it.card)}</span><span class="sub">${sub}</span></div>${ctl}</div>`;
}
// Items per lens context, for the page currently on top.
function itemsFor(ctx) {
  const pg = topPage();
  if (ctx === 'deck') { const d = deckById(pg.id); return playLines(d).map(l => ({ card: CARDS[l.id], n: l.n, zone: l.zone })); }
  if (ctx === 'coll') return Object.entries(COLL[pageUser('coll')] || {}).map(([id, n]) => ({ card: CARDS[id], n }));
  return quest(pageUser('quest')).map(q => ({ card: q.card, n: q.n, decks: q.decks }));
}
function pageUser(kind) {
  const pg = topPage();
  if (pg.user) return pg.user;
  return ME;
}

// ---------- Page bodies ----------
function collectionBody(user) {
  const own = user === ME, items = itemsFor('coll'), res = applyLens(items, 'coll');
  S.lists.coll = res.groups.flatMap(g => g.items.map(i => i.card.id));
  const head = `<div class="sumline"><b>${sum(items.map(i => i.n))}</b> cards · ${items.length} different${own ? '' : ` · <span class="sub">“you” shows your own count, for trades</span>`}</div>`;
  const editing = own && S.edit === 'coll';
  return (editing ? editBar('your collection') : '') + head + lensUI('coll', res) + renderGroups(res, it => editing
    ? editRow('coll', it, esc(it.card.type), bigStep('coll', it.card.id, it.n))
    : cardRow('coll', it, esc(it.card.type), own ? '' : `<span class="sub">you ${COLL.you[it.card.id] || 0}</span>`));
}
function questBody(user) {
  const own = user === ME, items = itemsFor('quest');
  if (!items.length) return `<p class="empty">${own ? 'Every deck you have is sleeveable.' : `${esc(firstName(user))} has every card their decks need.`}</p>`;
  const res = applyLens(items, 'quest');
  S.lists.quest = res.groups.flatMap(g => g.items.map(i => i.card.id));
  const nd = new Set(items.flatMap(i => i.decks.map(x => x.deck.id))).size;
  const head = `<div class="lens"><div class="sumline" style="flex:1"><b>${sum(items.map(i => i.n))}</b> cards to find for ${nd} deck${nd === 1 ? '' : 's'}</div><button data-act="export">Copy as text</button></div>`;
  return head + lensUI('quest', res) + renderGroups(res, it => cardRow('quest', it, esc(it.decks.map(x => `${x.deck.name} ${x.n}`).join(' · ')),
    own ? `<button class="mini" data-act="got" data-id="${it.card.id}">Got 1</button>` : `<span class="sub">you ${COLL.you[it.card.id] || 0}</span>`));
}
function deckBody(pg) {
  const d = deckById(pg.id), own = d.owner === ME, sub = pg.sub || 'cards';
  const t = total(d), sz = sizeOf(d.format), m = missingCount(d);
  const head = `<div class="dhead" style="background:${smooth(deckColors(d))}">
    <div class="pills"><span class="pill">${d.format}</span>${t === sz ? '<span class="pill ok">✓ Legal</span>' : `<span class="pill">${t} of ${sz}</span>`}
    ${m ? `<span class="pill warn">${m} missing</span>` : '<span class="pill ok">✓ Sleeveable</span>'}</div>
    <div class="dn">${esc(d.name)}</div><div>${own ? 'Your deck' : esc(USERS[d.owner]) + '’s deck · read-only'}</div></div>`;
  const acts = own ? (m ? `<button data-act="open-quest" data-user="${ME}">See the ${m} cards you need</button>` : '')
    : `<button class="primary" data-act="copy-deck" data-id="${d.id}">Copy to my decks</button>`;
  let body = '';
  if (sub === 'cards') {
    const editing = own && S.edit === 'deck:' + d.id, L0 = S.lensState.deck;
    S.catalogue = editing;
    // Unlocked and searching: the search covers the whole catalogue, each hit at the deck's current count (0 if new).
    const inDeck = needs(d);
    const items = editing && L0.q.trim()
      ? Object.values(CARDS).map(c => ({ card: c, n: inDeck[c.id] || 0, zone: d.commander.some(l => l[0] === c.id) ? 'commander' : 'main' }))
      : itemsFor('deck');
    const res = applyLens(items, 'deck');
    S.lists.deck = res.groups.flatMap(g => g.items.map(i => i.card.id));
    const have = COLL[d.owner] || {};
    body = lensUI('deck', res) + renderGroups(res, it => {
      const short = it.n - (have[it.card.id] || 0);
      if (it.n === 0) return editRow('deck', it, `${esc(it.card.type)} · <span class="newc">not in this deck · you own ${COLL.you[it.card.id] || 0}</span>`, bigStep('deck', it.card.id, 0, d.id));
      const s = esc(it.card.type) + (short > 0 ? ` · <span class="short">${own ? 'you' : firstName(d.owner)} need${own ? '' : 's'} ${short} more</span>` : '');
      return editing ? editRow('deck', it, s, bigStep('deck', it.card.id, it.n, d.id)) : cardRow('deck', it, s, '');
    });
  } else if (sub === 'stats') {
    const nl = playLines(d).filter(l => CARDS[l.id].kind !== 'Land');
    const b = [0,0,0,0,0,0,0]; nl.forEach(l => b[Math.min(CARDS[l.id].cmc, 6)] += l.n);
    const mx = Math.max(1, ...b), lands = t - sum(nl.map(l => l.n));
    const avg = nl.length ? (sum(nl.map(l => CARDS[l.id].cmc * l.n)) / sum(nl.map(l => l.n))).toFixed(2) : '0';
    body = `<div class="tiles"><div class="tile"><span class="tl">Lands</span><span class="tn">${lands}</span><span class="sub">of ${t}</span></div>
      <div class="tile"><span class="tl">Average MV</span><span class="tn">${avg}</span><span class="sub">nonland cards</span></div></div>
      <div class="gh">Mana curve</div><div class="list curve">${b.map((n, i) => `<div class="col"><span class="n">${n}</span><div class="barv" style="height:${n / mx * 70}%"></div><span class="k">${i === 6 ? '6+' : i}</span></div>`).join('')}</div>`;
  } else {
    body = `<div class="list">${d.notes.map(n => `<div class="note">${esc(n)}</div>`).join('')}</div>`;
  }
  return (own && S.edit === 'deck:' + d.id ? editBar('this deck') : '') + head + acts + pageSeg(pg, [['cards','Cards'],['stats','Stats'],['notes','Changes']]) + body;
}
function profileBody(pg) {
  const u = pg.user, decks = DECKS.filter(d => d.owner === u), k = sum(leads(u).map(x => x.k));
  const head = `<div class="phead"><div><div class="pn">${esc(USERS[u])}</div>
    <div class="sub">${decks.length} decks · ${sum(Object.values(COLL[u]))} cards${k ? ` · has ${k} cards you need` : ''}</div></div></div>`;
  const tabs = pageSeg(pg, [['decks','Decks'],['collection','Collection'],['quests','Quests']]);
  const body = pg.sub === 'decks' ? deckList(decks, false, `${esc(firstName(u))} has no decks yet.`) : pg.sub === 'collection' ? collectionBody(u) : questBody(u);
  return head + tabs + body;
}
function homeBody() {
  const my = DECKS.filter(d => d.owner === ME), sleeve = my.filter(d => total(d) === sizeOf(d.format) && missingCount(d) === 0), q = quest(ME);
  const nd = new Set(q.flatMap(i => i.decks.map(x => x.deck.id))).size;
  const tl = OTHERS.map(u => ({ u, l: leads(u) })).filter(x => x.l.length);
  return `<div class="tiles">
    <button class="tile" data-act="tab" data-tab="decks"><span class="tl">Decks</span><span class="tn">${my.length}</span><span class="sub">${sleeve.length} ready to sleeve</span></button>
    <button class="tile" data-act="open-quest" data-user="${ME}"><span class="tl">To find</span><span class="tn">${sum(q.map(x => x.n))}</span><span class="sub">cards for ${nd} decks</span></button>
    <button class="tile" data-act="tab" data-tab="coll"><span class="tl">Collection</span><span class="tn">${sum(Object.values(COLL.you))}</span><span class="sub">${Object.keys(COLL.you).length} different</span></button>
    <button class="tile" data-act="tab" data-tab="people"><span class="tl">Trade leads</span><span class="tn">${sum(tl.map(x => sum(x.l.map(y => y.k))))}</span><span class="sub">cards others have</span></button></div>
    <div class="gh">Who has what you need</div>
    <div class="list">${tl.map(({ u, l }) => `<div class="row person" data-act="open-person" data-user="${u}" data-target="profile" data-sub="collection">
      <span class="rowmain"><span class="nm">${esc(USERS[u])}</span><span class="sub">${esc(l.slice(0, 3).map(x => `${x.k} ${x.card.name}`).join(', '))}${l.length > 3 ? ` +${l.length - 3} more` : ''}</span></span><span class="pill ok">${sum(l.map(x => x.k))}</span></div>`).join('')}</div>
    <div class="gh">Your decks</div>${deckList(my, false, '')}
    <div class="gh">Recent changes</div><div class="list">${my.flatMap(d => d.notes.slice(0, 1).map(n => `<div class="note"><b>${esc(d.name)}</b><div class="sub">${esc(n)}</div></div>`)).join('')}</div>`;
}

function renderPage(pg) {
  const v = S.v, newBtn = `<button class="primary" data-act="new-deck">+ New</button>`;
  const myDecks = () => deckList(DECKS.filter(d => d.owner === ME), false, 'No decks yet. Make one with + New.');
  switch (pg.p) {
    case 'home': return { title: 'Knowledge Pool', body: homeBody() };
    case 'decks':
      if (v === 'a') return { title: 'Decks', right: S.seg.decks === 'mine' ? newBtn : '', body: seg('decks', [['mine','Mine'],['others','Others']]) +
        (S.seg.decks === 'mine' ? myDecks() : deckList(DECKS.filter(d => d.owner !== ME), true, 'Nobody else has made a deck yet.')) };
      if (v === 'c') {
        const groups = OTHERS.filter(u => DECKS.some(d => d.owner === u)).map(u =>
          `<button class="gh" data-act="open-person" data-user="${u}" data-target="profile">${esc(USERS[u])} ›</button>${deckList(DECKS.filter(d => d.owner === u), false, '')}`).join('');
        return { title: 'Decks', right: newBtn, body: `<div class="gh">Yours</div>${myDecks()}${groups}` };
      }
      return { title: 'Your decks', right: newBtn, body: myDecks() + `<p class="meta">Other people’s decks are on their page, under People.</p>` };
    case 'coll':
      if (v === 'a') return { title: 'Collection', right: S.seg.coll === 'mine' ? editBtn('coll') : '', body: seg('coll', [['mine','Mine'],['others','Others']]) + (S.seg.coll === 'mine' ? collectionBody(ME) : personRows('collOf')) };
      return { title: 'Your collection', right: editBtn('coll'), body: collectionBody(ME) };
    case 'quest':
      if (v === 'a') return { title: 'Quest list', body: seg('quest', [['mine','Mine'],['others','Others']]) + (S.seg.quest === 'mine' ? questBody(ME) : personRows('questOf')) };
      return { title: 'Quest list', body: questBody(ME) };
    case 'people': return { title: 'People', body: `<p class="meta">Everyone invited to this pool. Their decks, collections and quest lists are read-only.</p>` + personRows('profile') };
    case 'me': return { title: 'Me', right: S.seg.me === 'coll' ? editBtn('coll') : '', body: seg('me', [['coll','Collection'],['quest','Quest list']]) + (S.seg.me === 'coll' ? collectionBody(ME) : questBody(ME)) +
      `<p class="meta">Other people’s collections: tap a name above their decks, on the Decks tab.</p>` };
    case 'deck': { const d = deckById(pg.id); return { title: d.name, right: d.owner === ME ? editBtn('deck:' + d.id) : '', body: deckBody(pg) }; }
    case 'collOf': return { title: pg.user === ME ? 'Your collection' : `${firstName(pg.user)}’s collection`, right: pg.user === ME ? editBtn('coll') : '', body: collectionBody(pg.user) };
    case 'questOf': return { title: pg.user === ME ? 'Quest list' : `${firstName(pg.user)}’s quests`, body: questBody(pg.user) };
    case 'profile': return { title: firstName(pg.user), body: profileBody(pg) };
    case 'install': return { title: 'Get Knowledge Pool', body: installBody() };
  }
  return { title: '?', body: '' };
}

function cardSheet() {
  const { list, i, owner, ctx } = S.sheet, c = CARDS[list[i]], [text, pt, face] = RULES[c.id] || [''], pg = topPage();
  const faceBlock = (name, cost, type, txt, stat) => `<div class="cv-face"><div class="cv-head"><span class="cv-name">${esc(name)}</span>${costOf(parseCost(cost))}</div>
    <div class="cv-type">${esc(type)}</div><div class="cv-text">${rules(txt)}</div>${stat ? `<div class="cv-pt">${esc(stat)}</div>` : ''}</div>`;
  const cost = c.syms.map(x => `{${x}}`).join('');
  // What this card is doing on the page you came from, with its controls.
  let here = '';
  if (pg.p === 'deck') {
    const d = deckById(pg.id), n = needs(d)[c.id] || 0, mine = d.owner === ME;
    here = `<div class="cv-here"><span>In ${esc(d.name)}</span>${mine && S.edit === 'deck:' + d.id ? bigStep('deck', c.id, n, d.id) : `<b>${n}</b>`}</div>`;
  } else if (ctx === 'coll') {
    const u = owner || ME, n = (COLL[u] || {})[c.id] || 0;
    here = `<div class="cv-here"><span>In ${u === ME ? 'your' : esc(firstName(u)) + '’s'} collection</span>${u === ME && S.edit === 'coll' ? bigStep('coll', c.id, n) : `<b>${n}</b>`}</div>`;
  } else if (ctx === 'quest') {
    const u = owner || ME, q = quest(u).find(x => x.card.id === c.id);
    here = `<div class="cv-here"><span>${q ? `<b>${q.n}</b> still needed` : 'Found them all'}</span>${u === ME && q ? `<button class="mini" data-act="got" data-id="${c.id}">Got 1</button>` : ''}</div>`;
  }
  const used = DECKS.filter(d => d.owner === ME && needs(d)[c.id]).map(d => `${esc(d.name)} ${needs(d)[c.id]}`);
  const who = OTHERS.map(u => `${esc(firstName(u))} ${(COLL[u] || {})[c.id] || 0}`);
  const ctxDecks = pg.p === 'deck' ? [deckById(pg.id)] : DECKS.filter(d => d.owner === ME);
  const why = ctxDecks.flatMap(d => d.notes.filter(n => n.includes(c.name)).map(n => ({ d, n })))[0];
  return `<div id="cardview" class="cardview">${faceBlock(c.name, cost, c.type, text, pt)}${face ? faceBlock(face.name, face.cost, face.type, face.text) : ''}
      <div class="cv-foot"><span>${RARITY[c.rarity]}</span><span>${c.kind !== 'Land' ? `Mana value ${c.cmc}` : 'Land'}</span></div></div>
    <div class="cv-nav"><button data-act="card-step" data-val="-1" aria-label="Previous card">‹</button><span>${i + 1} of ${list.length}</span><button data-act="card-step" data-val="1" aria-label="Next card">›</button></div>
    ${here}
    <div class="facts">
      <div><span class="lbl">You own</span> <b>${COLL.you[c.id] || 0}</b></div>
      <div><span class="lbl">Your decks</span> ${used.length ? used.join(' · ') : 'none'}</div>
      <div><span class="lbl">Who has it</span> ${who.join(' · ')}</div>
      ${why ? `<div><span class="lbl">Why it’s in ${esc(why.d.name)}</span> ${esc(why.n)}</div>` : ''}
    </div>
    <div class="acts"><button data-act="close-sheet">Close</button></div>`;
}

    <section class="isec"><div class="gh">AI assistants</div>
      <p>Knowledge Pool is an MCP server. Any assistant that can connect to a remote MCP server can build and change your decks, using the same sign-in as this app.</p>
      <div class="kv"><span class="lbl">Address</span><span class="addr"><code>${MCP_URL}</code><button class="mini" data-act="copy" data-val="${MCP_URL}">Copy</button></span>
        <span class="lbl">Transport</span><span>Streamable HTTP</span>
        <span class="lbl">Sign-in</span><span>OAuth: your assistant opens a sign-in page, and you sign in with Google</span></div>
      <div class="lbl" style="margin-top:6px">Set up in</div>
      <div class="chips wrapchips">${CLIENTS.map(([k, l]) => `<button class="chip ${cl && cl[0] === k ? 'on' : ''}" data-act="client" data-val="${k}">${l}</button>`).join('')}</div>
      ${cl ? `<div class="howto">${cl[2]}</div>` : ''}
      <p class="meta">Decks, charts and card search show as interactive views in assistants that support MCP Apps, and as text everywhere else.</p>
    </section>`;
}

// ---------- Render ----------
function render() {
  const wide = innerWidth >= 760, desk = wide && S.frame === 'desktop', framed = wide && S.frame === 'phone';
  const pg = topPage(), page = renderPage(pg), key = S.v + S.tab + JSON.stringify(pg) + JSON.stringify(S.seg);
  const ae = document.activeElement, fid = ae && ae.id, sel = fid && ae.selectionStart != null ? [ae.selectionStart, ae.selectionEnd] : null;
  const oldMain = document.getElementById('main'), scroll = oldMain && key === S.lastKey ? oldMain.scrollTop : 0;
  const TAB_ICON = { decks: 'deck', coll: 'collection', quest: 'quest', people: 'people', home: 'stats', me: 'people' };
  const tabs = VARIANTS[S.v].tabs.map(([t, l]) => `<button class="tab ${S.tab === t ? 'on' : ''}" data-act="tab" data-tab="${t}">${icon(TAB_ICON[t])}<span>${l}</span></button>`).join('');
  const back = stack().length > 1 ? `<button class="back" data-act="back" aria-label="Back">‹</button>` : '';
  let sheet = '';
  if (S.sheet) sheet = `<div class="scrim" data-act="close-sheet"><div class="sheet" data-act="noop">${S.sheet.kind === 'lens' ? lensSheet(S.sheet.ctx) : S.sheet.kind === 'account' ? accountSheet() : cardSheet()}</div></div>`;
  document.getElementById('stage').className = 'stage' + (framed ? ' framed' : '');
  document.getElementById('stage').innerHTML = `<div class="phone block ${desk ? 'desk' : ''}">
    ${desk ? `<nav class="rail">${tabs}<span class="railfoot">${ACCOUNT_BTN(true)}</span></nav>` : ''}
    <header class="bar">${back}<h1>${esc(page.title)}</h1>${page.right || ''}${!desk && stack().length === 1 ? ACCOUNT_BTN() : ''}</header>
    <main id="main"><div class="inner">${page.body}</div></main>
    ${desk ? '' : `<nav class="tabs">${tabs}</nav>`}
    ${sheet}${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}</div>`;
  document.getElementById('strip').innerHTML = `<span class="tag">PROTOTYPE</span>
    <span class="grp"><button data-act="var" data-val="-1" aria-label="Previous variant">‹</button><b>${S.v.toUpperCase()} · ${VARIANTS[S.v].name}</b><button data-act="var" data-val="1" aria-label="Next variant">›</button></span>
    <code>${esc(url(pg))}</code>${wide ? `<button data-act="frame">${S.frame === 'phone' ? 'Desktop view' : 'Phone view'}</button>` : ''}`;
  document.getElementById('main').scrollTop = scroll; S.lastKey = key;
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  if (S.slide) { document.querySelector('#main .inner').classList.add(S.slide); S.slide = null; }
  if (!desk) wireSwipe();
  const cv = document.getElementById('cardview');
  if (cv && !desk) {
    let x0 = null;
    cv.onpointerdown = e => { x0 = e.clientX; cv.classList.add('drag'); cv.setPointerCapture(e.pointerId); };
    cv.onpointermove = e => { if (x0 != null) { const dx = e.clientX - x0; cv.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`; } };
    cv.onpointerup = e => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; cv.classList.remove('drag'); if (dx < -60) stepCard(1); else if (dx > 60) stepCard(-1); else cv.style.transform = ''; };
    cv.onpointercancel = () => { x0 = null; cv.classList.remove('drag'); cv.style.transform = ''; };
  }
}
// The page's own switch (Mine | Others, Cards | Stats | Changes, ...), for swiping.
function currentSegs() {
  const pg = topPage();
  if (S.v === 'a' && ['decks','coll','quest'].includes(pg.p)) return { opts: [['mine','Mine'],['others','Others']], cur: S.seg[pg.p], set: v => S.seg[pg.p] = v };
  if (pg.p === 'me') return { opts: [['coll','Collection'],['quest','Quest list']], cur: S.seg.me, set: v => S.seg.me = v };
  if (pg.p === 'deck') return { opts: [['cards','Cards'],['stats','Stats'],['notes','Changes']], cur: pg.sub || 'cards', set: v => pg.sub = v };
  if (pg.p === 'profile') return { opts: [['decks','Decks'],['collection','Collection'],['quests','Quests']], cur: pg.sub, set: v => pg.sub = v };
  return null;
}
function wireSwipe() {
  const main = document.getElementById('main'), inner = main.querySelector('.inner'), sg = currentSegs();
  if (!sg || S.sheet) return;
  const i = sg.opts.findIndex(o => o[0] === sg.cur);
  let x0 = null, y0 = 0, mode = null, peek = null;
  const end = () => { x0 = null; mode = null; inner.classList.remove('drag'); inner.style.transform = ''; if (peek) { peek.remove(); peek = null; } };
  main.onpointerdown = e => { if (e.target.closest('input, .chips, .qhelp') || (e.pointerType === 'mouse' && e.button !== 0)) return; x0 = e.clientX; y0 = e.clientY; mode = null; };
  main.onpointermove = e => {
    if (x0 == null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (!mode) { if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return; mode = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v'; if (mode === 'h') { main.setPointerCapture(e.pointerId); inner.classList.add('drag'); } }
    if (mode !== 'h') return;
    const next = sg.opts[i + (dx < 0 ? 1 : -1)];
    inner.style.transform = `translateX(${next ? dx : dx / 4}px)`;
    if (next && Math.abs(dx) > 24) {
      if (!peek) { peek = document.createElement('div'); main.parentElement.appendChild(peek); }
      peek.className = 'peek ' + (dx < 0 ? 'r' : 'l'); peek.textContent = dx < 0 ? `${next[1]} ›` : `‹ ${next[1]}`;
    } else if (peek) { peek.remove(); peek = null; }
  };
  main.onpointerup = e => {
    if (x0 == null) return;
    const dx = e.clientX - x0, h = mode === 'h'; end();
    if (!h || Math.abs(dx) < 60) return;
    const next = sg.opts[i + (dx < 0 ? 1 : -1)];
    if (next) { sg.set(next[0]); S.slide = dx < 0 ? 'in-r' : 'in-l'; render(); }
  };
  main.onpointercancel = end;
}
function stepCard(dir) { const s = S.sheet; s.i = (s.i + dir + s.list.length) % s.list.length; render(); }

function setHash() { const h = `#${S.v}`; if (location.hash !== h) try { history.replaceState(null, '', h); } catch (e) {} }
function readHash() {
  const m = location.hash.match(/^#([abcd])\b/);
  if (m) { const changed = m[1] !== S.v; S.v = m[1]; if (changed || !S.tab) resetNav(); }
}
function cycle(list, cur, dir) { const i = list.indexOf(cur); return list[(i + dir + list.length) % list.length]; }

// ---------- Events ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset, act = a.act, ctx = a.ctx, L = ctx && S.lensState[ctx];
  switch (act) {
    case 'noop': return;
    case 'open-account': S.sheet = { kind: 'account' }; break;
    case 'open-install': S.sheet = null; return push({ p: 'install' });
    case 'sign-out': S.sheet = null; return toast('Signed out (not really: prototype)');
    case 'theme': S.theme = a.val; if (a.val === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = a.val; break;
    case 'device': S.device = a.val; break;
    case 'client': S.client = a.val; break;
    case 'install': return toast('The browser would show its install prompt here');
    case 'copy': try { navigator.clipboard.writeText(a.val).then(() => toast('Address copied'), () => toast('Copy the address by hand')); } catch (err) { toast('Copy the address by hand'); } return;
    case 'var': S.v = cycle(Object.keys(VARIANTS), S.v, +a.val); resetNav(); setHash(); break;
    case 'lensui': S.lens = cycle(LENSES.map(x => x[0]), S.lens, +a.val); S.sheet = null; setHash(); break;
    case 'frame': S.frame = S.frame === 'phone' ? 'desktop' : 'phone'; try { localStorage.setItem('kp-proto-frame', S.frame); } catch (err) {} break;
    case 'tab': S.edit = null; if (S.tab === a.tab) S.stacks[a.tab] = [{ p: a.tab }]; S.tab = a.tab; S.sheet = null; break;
    case 'back': stack().pop(); S.edit = null; break;
    case 'toggle-edit': S.edit = S.edit === a.key ? null : a.key; break;
    case 'seg': S.seg[a.key] = a.val; S.edit = null; break;
    case 'sub': topPage().sub = a.val; break;
    case 'open-deck': return push({ p: 'deck', id: a.id, sub: 'cards' });
    case 'open-person': return push(a.target === 'profile' ? { p: 'profile', user: a.user, sub: a.sub || 'decks' } : { p: a.target, user: a.user });
    case 'open-quest': return push({ p: 'questOf', user: a.user });
    case 'card': {
      const pg = topPage(), owner = pg.p === 'deck' ? deckById(pg.id).owner : pg.user || ME;
      const list = S.lists[ctx] || [a.id]; S.sheet = { kind: 'card', list, i: Math.max(0, list.indexOf(a.id)), owner, ctx }; break;
    }
    case 'card-step': return stepCard(+a.val);
    case 'close-sheet': S.sheet = null; break;
    case 'open-lens': S.sheet = { kind: 'lens', ctx }; break;
    case 'set-group': L.group = a.val; break;
    case 'set-sort': L.sort = a.val; break;
    case 'cycle-group': L.group = cycle(GROUPS[ctx].map(x => x[0]), L.group, 1); break;
    case 'cycle-sort': L.sort = cycle(SORTS.map(x => x[0]), L.sort, 1); break;
    case 'tog-color': L.colors = L.colors.includes(a.val) ? L.colors.filter(x => x !== a.val) : [...L.colors, a.val]; break;
    case 'tog-type': L.types = L.types.includes(a.val) ? L.types.filter(x => x !== a.val) : [...L.types, a.val]; break;
    case 'clear-lens': Object.assign(L, newLens(GROUPS[ctx][0][0]), { q: L.q }); break;
    case 'add-token': L.query = (L.query.trim() + ' ' + a.val).trim() + ' '; render(); { const i = document.getElementById('qq-' + ctx); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } } return;
    case 'coll-inc': COLL.you[a.id] = (COLL.you[a.id] || 0) + 1; break;
    case 'coll-dec': if (COLL.you[a.id] > 1) COLL.you[a.id]--; else delete COLL.you[a.id]; break;
    case 'deck-inc': case 'deck-dec': {
      const d = deckById(a.deck), zone = d.commander.some(l => l[0] === a.id) ? d.commander : d.main;
      let l = zone.find(x => x[0] === a.id);
      if (!l) { if (act === 'deck-dec') break; l = [a.id, 0]; zone.push(l); }
      l[1] += act === 'deck-inc' ? 1 : -1; if (l[1] <= 0) zone.splice(zone.indexOf(l), 1);
      d.notes.unshift(`${act === 'deck-inc' ? '+1' : '−1'} ${CARDS[a.id].name} · changed on the web page`);
      return toast(`${act === 'deck-inc' ? 'Added' : 'Took out'} 1 ${CARDS[a.id].name} · saved`);
    }
    case 'got': COLL.you[a.id] = (COLL.you[a.id] || 0) + 1; return toast(`Added 1 ${CARDS[a.id].name} to your collection`);
    case 'export': return toast('Quest list copied as text (not really: prototype)');
    case 'copy-deck': {
      const s = deckById(a.id), d = { ...s, id: s.id + '-copy-' + DECKS.length, name: s.name + ' (copy)', owner: ME,
        commander: s.commander.map(l => [...l]), main: s.main.map(l => [...l]), notes: [`Copied from ${USERS[s.owner]}’s deck`] };
      DECKS.push(d); push({ p: 'deck', id: d.id, sub: 'cards' }); return toast(`Copied. ${d.name} is yours to change.`);
    }
    case 'new-deck': {
      const d = { id: 'new' + DECKS.length, name: 'Untitled deck', format: 'Pioneer', owner: ME, commander: [], main: [], notes: ['Created'] };
      DECKS.push(d); return push({ p: 'deck', id: d.id, sub: 'cards' });
    }
  }
  render();
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset.input) return;
  S.lensState[el.dataset.ctx][el.dataset.input] = el.value; render();
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'Escape' && S.sheet) { S.sheet = null; return render(); }
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const dir = e.key === 'ArrowLeft' ? -1 : 1;
  if (S.sheet && S.sheet.kind === 'card') return stepCard(dir);
  S.v = cycle(Object.keys(VARIANTS), S.v, dir); resetNav(); setHash(); render();
});
addEventListener('hashchange', () => { readHash(); render(); });
addEventListener('resize', () => render());
resetNav(); readHash(); setHash(); render();
</script>
